server.port: 9999

spring:
    application.name: Gateway
    cloud:
        gateway:
          routes:
              - id: delivery-tracking-route
                uri: lb://delivery-tracking
                predicates:
                  - Path=/api/v1/deliveries/**
                  - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
              - id: courier-management-route
                uri: lb://courier-management
                predicates:
                  - Path=/api/v1/couriers/**
                  - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
              # É possível configurar rotas personalizadas e direcioná-las para caminhos específicos
              # Também é possível definir filtros que modificam as informações que essas rotas fornecem, por exemplo removendo um ou mais campos de um JSON.
              - id: courier-management-public-route
                uri: lb://courier-management
                predicates:
                  - Path=/public/couriers
                  - Method=GET
                filters:
                - RewritePath=/public/couriers, /api/v1/couriers
                - RemoveJsonAttributesResponseBody=pendingDeliveruies,pendingDeliveriesQuantity,phone,true
              - id: courier-management-public-segments-route
                uri: lb://courier-management
                predicates:
                  - Path=/public/couriers/**
                  - Method=GET
                filters:
                - RewritePath=/public/couriers/?(?<segment>.*), /api/v1/couriers/$\{segment}
                - RemoveJsonAttributesResponseBody=pendingDeliveruies,pendingDeliveriesQuantity,phone,true
eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      default-zone: http://localhost:8761/eureka/